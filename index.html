const HOME_COORDS = {
  SH:{lat:-37.8776,lng:145.0436}, EY:{lat:-37.9072,lng:144.7532},
  EM:{lat:-37.9805,lng:145.0658}, YH:{lat:-37.8776,lng:145.0436},
};

function haversine(lat1,lng1,lat2,lng2){
  const R=6371,r=x=>x*Math.PI/180;
  const x=Math.sin(r(lat2-lat1)/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lng2-lng1)/2)**2;
  return R*2*Math.asin(Math.sqrt(x));
}

function fallbackDrive(tech, suburb){
  const h=HOME_COORDS[tech.id];
  const km=haversine(h.lat,h.lng,suburb.lat,suburb.lng);
  const cross=(h.lng>144.96&&suburb.lng<144.93)||(h.lng<144.93&&suburb.lng>144.96);
  return { mins:Math.round(km*(cross?1.62:1.35)/30*60), km:Math.round(km*10)/10, source:'estimate' };
}

// Single Google API call for all technicians (deduplicates SH+YH)
async function fetchGoogleDriveTimes(suburb){
  const uniqueOrigins = [
    "Caulfield VIC 3162 Australia",   // row 0 → SH + YH
    "Point Cook VIC 3030 Australia",  // row 1 → EY
    "Mentone VIC 3194 Australia",     // row 2 → EM
  ];
  const destination = `${suburb.n} VIC ${suburb.p} Australia`;
  const params = new URLSearchParams({
    origins:        uniqueOrigins.join('|'),
    destinations:   destination,
    mode:           'driving',
    avoid:          'tolls',        // routes around CityLink
    departure_time: 'now',          // live traffic
    key:            GOOGLE_API_KEY,
  });
  const res = await fetch(`https://maps.googleapis.com/maps/api/distancematrix/json?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.status !== 'OK') throw new Error(data.error_message || data.status);

  const rowMap = { SH:0, EY:1, EM:2, YH:0 };
  const out = {};
  TECHS.forEach(t => {
    const el = data.rows[rowMap[t.id]]?.elements[0];
    if (el?.status === 'OK') {
      const secs = el.duration_in_traffic?.value ?? el.duration.value;
      out[t.id] = {
        mins: Math.round(secs / 60),
        km:   Math.round(el.distance.value / 100) / 10,
        source: 'google',
        withTraffic: !!el.duration_in_traffic,
      };
    }
  });
  return out;
}

      return { ...t, mins, km, source, withTraffic, canGate, status, reasons };

        </div>

        {!any && !isLoading && (
          <div style={{padding:"13px 15px",borderRadius:9,background:"#fef2f2",border:"1.5px solid #fca5a5",marginBottom:12,display:"flex",gap:9}}>
            <i className="ti ti-alert-triangle" style={{fontSize:17,color:"#dc2626",flexShrink:0}}/>
            <p style={{...F,margin:0,fontSize:13,color:"#dc2626",fontWeight:600}}>No eligible technician found for this job. Manual review required.</p>
          </div>
        )}

        <div style={{display:"grid",gap:9,marginBottom:24}}>
          {results.map(r => {
            const si = ST[r.status];
            return (
              <div key={r.id} style={{...card,opacity:r.status==="no"?.6:1,borderColor:r.status!=="no"?si.bdr:"#e5e7eb"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:42,height:42,borderRadius:"50%",background:r.color,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:"#fff",flexShrink:0,...FM}}>{r.id}</div>
                    <div>
                      <p style={{...FM,margin:0,fontWeight:700,fontSize:14,color:"#111827"}}>Technician {r.id}</p>
                      <p style={{...F,margin:0,fontSize:11,color:"#9ca3af"}}>Based in {r.home} · max {r.maxMin} min travel</p>
                    </div>
                  </div>
                  {isLoading
                    ? <span style={{...FM,fontSize:12,color:"#6b7280",display:"flex",alignItems:"center",gap:5}}><i className="ti ti-refresh spin" style={{fontSize:12}}/></span>
                    : <span className="tag" style={{background:si.bg,color:si.tc}}><i className={`ti ${si.icon}`} style={{fontSize:11}}/>{si.label}</span>
                  }
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"5px 16px",fontSize:12,color:"#6b7280",paddingTop:9,borderTop:"1px solid #f3f4f6",alignItems:"center"}}>
                  <span style={{...F,display:"flex",alignItems:"center",gap:4}}>
                    <i className="ti ti-clock" style={{color:"#e82424",fontSize:12}}/>
                    {isLoading ? <span className="pulse" style={{background:"#e5e7eb",borderRadius:4,width:44,height:11,display:"inline-block"}}/> : `${r.mins} min from home`}
                  </span>
                  <span style={{...F,display:"flex",alignItems:"center",gap:4}}>
                    <i className="ti ti-map" style={{color:"#e82424",fontSize:12}}/>
                    {isLoading ? <span className="pulse" style={{background:"#e5e7eb",borderRadius:4,width:30,height:11,display:"inline-block"}}/> : `${r.km} km`}
                  </span>
                  <span style={{...F,display:"flex",alignItems:"center",gap:4,color:r.canGate?"#16a34a":"#dc2626"}}>
                    <i className={`ti ${r.canGate?"ti-check":"ti-x"}`} style={{fontSize:12}}/>{form.gateType} gate: {r.canGate?"yes":"no"}
                  </span>
                  {!isLoading && <DriveTimeBadge source={r.source} withTraffic={r.withTraffic}/>}
                  {r.flex && r.status!=="no" && !isLoading && <span style={{...F,display:"flex",alignItems:"center",gap:4}}><i className="ti ti-info-circle" style={{fontSize:12}}/>May be closer if already near job</span>}
                </div>
                {!isLoading && r.reasons.map((reason,i) => (
                  <p key={i} style={{...F,margin:"7px 0 0",fontSize:11,color:r.status==="no"?"#dc2626":"#92400e",display:"flex",alignItems:"center",gap:4}}>
                    <i className="ti ti-alert-circle" style={{fontSize:11,flexShrink:0}}/>{reason}
                  </p>
                ))}
              </div>
            );
          })}
        </div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          {BackBtn}
          <button style={btnRed} className="btn-red" onClick={reset}><i className="ti ti-plus"/>New enquiry</button>
        </div>
      </div>
    );
  };

  // ── Header logo ────────────────────────────────────────────────────
  const GateLogo = () => (
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="6" fill="#1e4d49"/>
        <path d="M7 27V15C7 11.134 10.134 8 14 8H22C25.866 8 29 11.134 29 15V27" stroke="white" strokeWidth="2" strokeLinecap="round"/>
        <path d="M14 27V20C14 18.895 14.895 18 16 18H20C21.105 18 22 18.895 22 20V27" stroke="white" strokeWidth="2" strokeLinecap="round"/>
        <circle cx="18" cy="13" r="2" fill="white"/>
        <path d="M4 27H32" stroke="white" strokeWidth="2.5" strokeLinecap="round"/>
      </svg>
      <div>
        <span style={{...FM,fontSize:16,fontWeight:800,color:"#111827",letterSpacing:"-0.01em"}}>Gate <span style={{fontWeight:500}}>Gurus</span></span>
        <div style={{...F,fontSize:10,color:"#6b7280",fontWeight:500,marginTop:-1}}>Admin · Dispatch Tool</div>
      </div>
    </div>
  );

  // ── Main render ────────────────────────────────────────────────────
  return (
    <div style={{width:"100%"}}>
      {/* Header */}
      <div style={{background:"#fff",borderRadius:"12px 12px 0 0",padding:"14px 20px",borderBottom:"3px solid #e82424",border:"1.5px solid #e5e7eb",borderBottomColor:"#e82424",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <GateLogo/>
        <div style={{textAlign:"right"}}>
          <div style={{background:"#16a34a",color:"#fff",fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:20,display:"inline-flex",alignItems:"center",gap:4,...FM}}>
            <i className="ti ti-phone" style={{fontSize:11}}/>(03) 9052 4903
          </div>
          <div style={{...FM,fontSize:10,color:"#9ca3af",marginTop:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".05em"}}>Admin portal</div>
        </div>
      </div>

      {/* Form body */}
      <div style={{background:"#fff",padding:"24px 20px",border:"1.5px solid #e5e7eb",borderTop:"none",borderRadius:"0 0 12px 12px"}}>
        {step<=5 && !isReferral && <Progress/>}
        {step===1 && renderSuburb()}
        {step===2 && renderService()}
        {isReferral && renderReferral()}
        {step===3 && !isReferral && renderProblem()}
        {step===4 && !isReferral && renderDamage()}
        {step===5 && !isReferral && renderGateType()}
        {step===6 && !isReferral && renderResults()}
      </div>

      {/* Footer */}
      <div style={{textAlign:"center",marginTop:12,fontSize:11,...F,color:"#9ca3af"}}>
        <a href="https://gategurus.com.au" style={{color:"#9ca3af",textDecoration:"none"}} target="_blank" rel="noopener noreferrer">gategurus.com.au</a>
        {" · "}Internal dispatch tool
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
